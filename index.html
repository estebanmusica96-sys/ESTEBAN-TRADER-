<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Mercados</title>
<style>
  :root{
    --bg:#0A0D12;
    --panel-bg:#10141B;
    --line:#232A35;
    --text-dim:#7C8798;
    --text:#C9D1DE;
    --accent:#FFB020;
    --yt-red:#FF0000;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--bg); }
  body{
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    color:var(--text);
  }
  .dashboard{
    display:grid;
    grid-template-rows: 75fr 25fr;
    height:100vh;
    height:100dvh;
    width:100%;
    gap:1px;
    background:var(--line);
  }
  .screen-top{
    display:grid;
    grid-template-rows: 23fr 21fr 11fr 20fr;
    gap:1px;
    background:var(--line);
    min-height:0;
  }
  .screen-bottom{
    display:grid;
    grid-template-columns: 11fr 10fr 10fr;
    gap:1px;
    background:var(--line);
    min-height:0;
  }
  .row{
    display:grid;
    gap:1px;
    background:var(--line);
    min-height:0;
  }
  .row-2col{ grid-template-columns: 45fr 55fr; }
  .panel{
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    background:var(--panel-bg);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:4px 10px;
    font-size:11px;
    letter-spacing:.02em;
    color:var(--text-dim);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .panel-head span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .panel-open{
    color:var(--text-dim);
    text-decoration:none;
    flex:0 0 auto;
  }
  .panel-open:hover{ color:var(--accent); }
  .panel-frame{
    flex:1 1 auto;
    width:100%;
    height:100%;
    border:0;
    background:#fff;
  }

  /* Estilos del Buscador y Reproductor Integrado con API de YouTube */
  .yt-player-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--panel-bg);
    padding: 6px;
    gap: 4px;
    overflow: hidden;
  }
  .yt-search-box {
    display: flex;
    gap: 4px;
    flex: 0 0 auto;
  }
  .yt-search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 10px;
    border-radius: 2px;
  }
  .yt-search-input:focus {
    border-color: var(--yt-red);
    outline: none;
  }
  .yt-search-btn {
    background: var(--line);
    border: none;
    color: var(--text);
    padding: 4px 8px;
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    border-radius: 2px;
  }
  .yt-search-btn:hover {
    background: var(--yt-red);
    color: #fff;
  }
  .yt-layout {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 4px;
    flex: 1;
    min-height: 0;
  }
  .yt-results-list {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .yt-result-item {
    padding: 6px 8px;
    font-size: 9px;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .yt-result-item:hover {
    background: var(--line);
    color: var(--text);
  }
  .yt-screen {
    background: #000;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    height: 100%;
  }
  .yt-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  @media (max-width: 900px){
    .dashboard{
      display:block;
      height:100vh;
      height:100dvh;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      scroll-snap-type:y mandatory;
    }
    .screen-top,
    .screen-bottom{
      height:100vh;
      height:100dvh;
      scroll-snap-align:start;
      scroll-snap-stop:always;
    }
    .yt-layout {
      grid-template-columns: 1fr;
      grid-template-rows: 90px 1fr;
    }
  }
</style>
</head>
<body>
<div class="dashboard">

  <section class="screen-top">
    <div class="row row-2col">
      <div class="panel">
        <div class="panel-head"><span>1 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head"><span>2 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
    </div>

    <div class="row row-2col">
      <div class="panel">
        <div class="panel-head"><span>3 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head"><span>4 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
    </div>

    <div class="row row-2col">
      <div class="panel">
        <div class="panel-head"><span>5 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head"><span>6 · gocharting.com</span><a class="panel-open" href="https://gocharting.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://gocharting.com" loading="lazy"></iframe>
      </div>
    </div>

    <div class="row row-2col">
      <div class="panel">
        <div class="panel-head"><span>7 · finviz.com</span><a class="panel-open" href="https://finviz.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://finviz.com" loading="lazy"></iframe>
      </div>
      <div class="panel">
        <div class="panel-head"><span>8 · forexfactory.com</span><a class="panel-open" href="https://www.forexfactory.com" target="_blank" rel="noopener noreferrer">↗</a></div>
        <iframe class="panel-frame" src="https://www.forexfactory.com" loading="lazy"></iframe>
      </div>
    </div>
  </section>

  <section class="screen-bottom">
    <div class="panel">
      <div class="panel-head"><span>9 · tradingview.com</span><a class="panel-open" href="https://es.tradingview.com" target="_blank" rel="noopener noreferrer">↗</a></div>
      <iframe class="panel-frame" src="https://es.tradingview.com" loading="lazy"></iframe>
    </div>
    <div class="panel">
      <div class="panel-head"><span>10 · market24hclock.com</span><a class="panel-open" href="https://market24hclock.com" target="_blank" rel="noopener noreferrer">↗</a></div>
      <iframe class="panel-frame" src="https://market24hclock.com" loading="lazy"></iframe>
    </div>
    
    <div class="panel">
      <div class="panel-head"><span id="ytPanelTitle">11 · Buscador Multimedia (YouTube)</span></div>
      <div class="yt-player-container">
        <div class="yt-search-box">
          <input type="text" id="ytQuery" class="yt-search-input" placeholder="Buscar artista o canción..." value="Eladio Carrion">
          <button class="yt-search-btn" onclick="searchYouTubeTracks()">🔍 Buscar</button>
        </div>
        <div class="yt-layout">
          <div id="ytResultsList" class="yt-results-list">
            <div class="yt-result-item">Haz clic en Buscar...</div>
          </div>
          <div class="yt-screen">
            <iframe id="ytInternalPlayer" src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?enablejsapi=1&autoplay=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
  const YT_API_KEY = "AIzaSyCgzchU3x68XVIzwhU-iCbRdJcSwn-1XAo";

  async function searchYouTubeTracks() {
    const query = document.getElementById('ytQuery').value.trim();
    const listContainer = document.getElementById('ytResultsList');
    if (!query) return;

    listContainer.innerHTML = '<div class="yt-result-item">Buscando...</div>';

    try {
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${YT_API_KEY}`;
      const response = await fetch(url);
      const data = await response.json();

      listContainer.innerHTML = '';
      
      if (data.error) {
        listContainer.innerHTML = `<div class="yt-result-item" style="color:#ff4444;">Error: ${data.error.message}</div>`;
        return;
      }

      if (!data.items || data.items.length === 0) {
        listContainer.innerHTML = '<div class="yt-result-item">No se encontraron resultados.</div>';
        return;
      }

      data.items.forEach(item => {
        const videoId = item.id.videoId;
        let title = item.snippet.title;
        // Limpiar entidades HTML comunes en los títulos de YouTube
        title = title.replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"');
        const channel = item.snippet.channelTitle;

        const div = document.createElement('div');
        div.className = 'yt-result-item';
        div.innerText = `${title} (${channel})`;
        div.title = `${title} - ${channel}`;
        div.onclick = () => playYtVideo(videoId, title);
        listContainer.appendChild(div);
      });
    } catch (err) {
      listContainer.innerHTML = '<div class="yt-result-item" style="color:#ff4444;">Error de red al buscar.</div>';
    }
  }

  function playYtVideo(videoId, title) {
    const iframe = document.getElementById('ytInternalPlayer');
    const headerTitle = document.getElementById('ytPanelTitle');
    
    headerTitle.innerText = "▶ " + title;
    iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?enablejsapi=1&autoplay=1`;
  }

  window.onload = () => {
    searchYouTubeTracks();
  };
</script>
</body>
</html>
